version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # Nuxt 3.21 + @nuxtjs/i18n 9 (i18n/locales layout) is the tested pair.
      # i18n majors and @pinia/nuxt 0.7 broke the image before (0.7 fails
      # prerender with "obj.hasOwnProperty is not a function"); bump them deliberately.
      - dependency-name: "@nuxtjs/i18n"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@pinia/nuxt"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # node:26-alpine ships without corepack, so pnpm is never installed. Stay on the LTS line.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
