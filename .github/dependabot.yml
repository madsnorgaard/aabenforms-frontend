version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # Nuxt is pinned to 3.15.0; these majors break the build against it
      # (i18n v10 needs the i18n/ directory layout and a newer Nuxt,
      # @pinia/nuxt 0.7 fails prerender with "obj.hasOwnProperty is not a function").
      - dependency-name: "@nuxtjs/i18n"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@pinia/nuxt"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # node:26-alpine ships without corepack, so pnpm is never installed. Stay on the LTS line.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
