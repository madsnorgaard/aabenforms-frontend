version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # Nuxt 4.6 + @nuxtjs/i18n 10 (i18n/locales layout) + @pinia/nuxt 0.11 (Pinia 3) is
      # the tested set. @pinia/nuxt 1.x (Pinia 4) and future i18n majors are bumps to
      # make on purpose, with the e2e suite as the gate.
      - dependency-name: "@nuxtjs/i18n"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@pinia/nuxt"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pinia"
        update-types: ["version-update:semver-major"]
      # Majors that the build check rejected on 2026-09-17 (#50 tailwind 4). Nuxt 4
      # landed via #98. TypeScript 7 (#51) builds but is the new native compiler;
      # vue-tsc support is not established, so it is also an upgrade to do on purpose.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # node:26-alpine ships without corepack, so pnpm is never installed. Stay on the LTS line.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]


  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
